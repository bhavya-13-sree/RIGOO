<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="rigoo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E88E5"/>
      <stop offset="50%" stop-color="#1769D2"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#00B0FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0D47A1" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Rounded Shield / Icon Shape -->
  <rect x="50" y="50" width="400" height="400" rx="90" fill="url(#rigoo-grad)" filter="url(#shadow)"/>

  <!-- Route Arc / Connectivity Line -->
  <path d="M 120 340 C 180 200, 320 200, 380 340" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="12" stroke-linecap="round" stroke-dasharray="16 12"/>

  <!-- Bike Wheel Left -->
  <circle cx="170" cy="310" r="48" fill="none" stroke="#FFFFFF" stroke-width="14"/>
  <circle cx="170" cy="310" r="14" fill="#00E676"/>

  <!-- Bike Wheel Right -->
  <circle cx="330" cy="310" r="48" fill="none" stroke="#FFFFFF" stroke-width="14"/>
  <circle cx="330" cy="310" r="14" fill="#00E676"/>

  <!-- Bike Frame -->
  <polyline points="170,310 240,310 280,240 210,240 170,310" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>
  
  <!-- Seat Post & Saddle -->
  <line x1="240" y1="310" x2="225" y2="205" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
  <path d="M 205 205 L 245 205 Q 250 205 245 212 Q 225 215 205 205" fill="#00E676"/>

  <!-- Handlebar Post & Handlebars -->
  <line x1="330" y1="310" x2="295" y2="185" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
  <path d="M 280 185 L 310 185 L 320 198" fill="none" stroke="#00E676" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Commuter Rider Silhouette / Helmet Shield -->
  <circle cx="255" cy="145" r="26" fill="#FFFFFF"/>
  <path d="M 255 125 C 272 125, 280 135, 275 150 C 265 155, 245 155, 238 145 Z" fill="#00B0FF"/>

  <!-- Sparkle / AI Node Marker -->
  <circle cx="370" cy="130" r="22" fill="url(#accent-grad)"/>
  <polygon points="370,118 373,127 382,130 373,133 370,142 367,133 358,130 367,127" fill="#FFFFFF"/>
</svg>
